apply plugin: 'com.android.application'

android {
    namespace 'com.yannieforest.thefoundry'
    compileSdk 34

    defaultConfig {
        applicationId "com.yannieforest.thefoundry"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        // Java 8 bytecode, which both the modern and the fallback toolchains
        // accept without argument.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // The app page is a plain asset. Left compressed it cannot be memory-mapped
    // and opens more slowly, so it is stored uncompressed.
    aaptOptions {
        noCompress 'html'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
